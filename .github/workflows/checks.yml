name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  projects:
    name: Scripts, lab files and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install with the release age policy
        run: pnpm install --frozen-lockfile
      - name: German and English variants match their sources
        run: node scripts/localize.mjs --check
      - name: Scripts behave as intended, the parameter generator agrees in JavaScript and Python
        run: node --test "scripts/*.test.mjs"
      - name: Scripts of the site behave as intended
        working-directory: site
        run: node --test "tests/*.test.mjs"
      - name: Shell scripts of the lab pass ShellCheck
        run: shellcheck lab/*.sh lab/one-deploy/*.sh lab/iaas/*.sh lab/tenants/*.sh platform/*.sh platform/gitea/*.sh platform/repo/tofu/*.sh platform/observability/*.sh platform/operations/*.sh
      - name: Python scripts compile
        run: python -m py_compile checks/check.py scripts/params.py case/webshop/app.py case/webshop/load.py
      - name: The site builds
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm --filter ./site run build
      - name: Every internal link and anchor of the site resolves
        run: python scripts/check_links.py
      - name: Figures are reproducible
        run: |
          node figures/start.mjs
          node figures/basics.mjs
          node figures/iaas.mjs
          node figures/tenants.mjs
          node figures/platform.mjs
          node figures/observability.mjs
          node figures/operations.mjs
          node figures/extras.mjs
          node figures/favicon.mjs
          git diff --exit-code

  text:
    name: House style and languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: House style
        run: python scripts/check_style.py
      - name: Both languages have the same structure
        run: python scripts/check_parity.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].{0,98}$'; then
            echo "The title becomes the squash commit message and must follow Conventional Commits."
            exit 1
          fi
