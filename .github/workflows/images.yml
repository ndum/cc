name: images

on:
  pull_request:
    paths: [case/**]
  push:
    branches: [main]
    paths: [case/**]
    tags: [webshop-v*]

permissions:
  contents: read

jobs:
  image:
    name: Image of ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [webshop]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A pull request only builds the image, main publishes it as main, a tag webshop-v1.0.0 as 1.0.0
      - name: Image tags
        id: tags
        env:
          APP: ${{ matrix.app }}
        run: |
          image=ghcr.io/${{ github.repository }}/$APP
          if [[ "$GITHUB_REF" == refs/tags/$APP-v* ]]; then
            echo "tags=$image:${GITHUB_REF#refs/tags/$APP-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:main" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.tags.outputs.skip != 'true'
        with:
          context: case/${{ matrix.app }}
          file: case/${{ matrix.app }}/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
