# The model answers its own namespace, Prometheus and members whose namespace carries the label ai=allowed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              ai: allowed
