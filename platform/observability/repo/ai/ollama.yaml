# Ollama serves the local language model on the agent, chapter 5.5
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
  labels:
    app: ollama
spec:
  replicas: 1
  # The volume belongs to one node, the new pod may only start once the old one is gone
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # The agent carries the inference, the server keeps the control plane and monitoring
      nodeSelector:
        kubernetes.io/hostname: k3s-agent
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.40.13
          ports:
            - name: http
              containerPort: 11434
          env:
            # Keep the model in memory for 30 minutes after the last request
            - name: OLLAMA_KEEP_ALIVE
              value: 30m
            # Two requests at a time, more would share the four cores and get slower each
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /
              port: http
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
