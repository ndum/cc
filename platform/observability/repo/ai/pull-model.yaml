# After every sync Argo CD runs this job, it loads the model if it is not there yet
apiVersion: batch/v1
kind: Job
metadata:
  name: pull-model
  namespace: ai
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: docker.io/curlimages/curl:8.17.0
          args:
            - -fsS
            - --max-time
            - "1800"
            - http://ollama.ai.svc:11434/api/pull
            - -d
            - '{"model": "llama3.2:3b", "stream": false}'
