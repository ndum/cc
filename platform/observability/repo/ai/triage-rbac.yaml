# The triage service may read and restart deployments in the namespace velo, nothing else
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: triage
  namespace: velo
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: triage
  namespace: velo
subjects:
  - kind: ServiceAccount
    name: triage
    namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: triage
