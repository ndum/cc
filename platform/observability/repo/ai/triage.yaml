# The triage service, chapter 5.6. It gets alerts from Alertmanager and shows its proposals on port 30880
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage
  namespace: ai
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: triage-audit
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage
  namespace: ai
  labels:
    app: triage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: triage
  template:
    metadata:
      labels:
        app: triage
    spec:
      serviceAccountName: triage
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: triage
          image: ghcr.io/ndum/cc/triage:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODEL
              value: llama3.2:3b
            # The only deployments the service may restart
            - name: ALLOWED_TARGETS
              value: velo/webshop
            # Empty means every action needs the approval of a person
            - name: AUTONOMOUS_ACTIONS
              value: ""
            # Added to every question to the model, chapter 5.6
            - name: EXTRA_INSTRUCTIONS
              value: ""
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: audit
              mountPath: /data
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: triage-audit
---
apiVersion: v1
kind: Service
metadata:
  name: triage
  namespace: ai
spec:
  type: NodePort
  selector:
    app: triage
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30880
