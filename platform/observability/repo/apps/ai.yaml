# The local language model and the triage service in the namespace ai
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://FRONTEND:3000/wolkenwerk/platform.git
    targetRevision: main
    path: ai
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
