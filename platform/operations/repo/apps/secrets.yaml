# The encrypted secrets of the platform from the folder secrets, only the controller in the cluster can read them
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://FRONTEND:3000/wolkenwerk/platform.git
    targetRevision: main
    path: secrets
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # After a rebuild the type SealedSecret only exists once the controller runs, so try again
    retry:
      limit: 10
      backoff:
        duration: 30s
