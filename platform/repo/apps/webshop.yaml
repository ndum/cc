# The web shop of Veloatelier Matte in the namespace velo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webshop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://FRONTEND:3000/wolkenwerk/platform.git
    targetRevision: main
    path: webshop
  destination:
    server: https://kubernetes.default.svc
    namespace: velo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
