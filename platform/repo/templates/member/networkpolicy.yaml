# Pods of a member accept traffic only from their own namespace and from the ingress of k3s in kube-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: member
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
