# Upper limit of the whole namespace, like the quota of the group in OpenNebula
apiVersion: v1
kind: ResourceQuota
metadata:
  name: member
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    services.nodeports: "0"
    # ServiceLB of k3s would open the port of a LoadBalancer service on every node, even without a node port
    services.loadbalancers: "0"
    persistentvolumeclaims: "2"
