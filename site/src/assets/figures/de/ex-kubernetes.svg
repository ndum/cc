<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-labelledby="ex-kubernetes-de-title ex-kubernetes-de-desc">
<title id="ex-kubernetes-de-title">Die Objekte des Webshops</title>
<desc id="ex-kubernetes-de-desc">Alle Objekte liegen im Namespace velo. Oben der Weg einer Anfrage. Traefik setzt den Ingress webshop um, der alle Pfade an den Port http des Services webshop schickt. Der Service hat eine feste Adresse im Cluster und den Port 80. Über seinen Selektor app=webshop füllt Kubernetes die EndpointSlice mit den Adressen der bereiten Pods. Die Anfrage geht an Port 8080 eines dieser Pods. In der Mitte die beiden Pods webshop-7d4f56cb9b-chxkw und webshop-7d4f56cb9b-mjsjj. Unten das Deployment webshop. Es verwaltet das ReplicaSet webshop-7d4f56cb9b, das mit app=webshop und pod-template-hash seine beiden Pods auswählt und am Laufen hält. Achte darauf, dass Service, ReplicaSet und Deployment ihre Pods über das Label app=webshop finden, ohne deren Namen zu kennen.</desc>
