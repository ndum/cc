<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 574" role="img" aria-labelledby="ex-opennebula-de-title ex-opennebula-de-desc">
<title id="ex-opennebula-de-title">Dienste und Treiber von OpenNebula</title>
<desc id="ex-opennebula-de-desc">Oben die Dienste auf dem Front-end. FireEdge liefert Sunstone auf Port 2616 aus. guacd auf Port 4822 bringt die Konsole einer VM in den Browser. OneFlow läuft auf Port 2474, OneGate auf Port 5030. Wie die CLI und OpenTofu rufen FireEdge, OneFlow und OneGate die API von oned auf, über XML-RPC auf Port 2633 oder gRPC auf Port 2634. oned speichert alle Objekte als XML in MariaDB und gibt die Arbeit an seine Treiber ab, die wie oned als oneadmin laufen. Scheduler und Datastore arbeiten nur auf dem Front-end. Die Treiber für Virtualisierung und Transfer erreichen die Knoten über SSH. Dort liegen ihre Skripte unter /var/tmp/one/, kopiert aus /var/lib/one/remotes/ auf dem Front-end. vmm/kvm startet die VMs mit libvirt und KVM, vnm/vxlan richtet ihr Netz ein. Der Transfertreiber legt disk.0 und disk.1 in den Datastore 0. Ein Agent führt die Proben aus im/kvm-probes.d/ aus und schickt die Werte an onemonitord auf Port 4124. Achte darauf, dass auf den Knoten kein Dienst von OpenNebula läuft. Dort arbeiten nur Skripte, die das Front-end über SSH startet.</desc>
