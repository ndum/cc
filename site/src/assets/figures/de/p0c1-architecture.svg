<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 564" role="img" aria-labelledby="p0c1-architecture-de-title p0c1-architecture-de-desc">
<title id="p0c1-architecture-de-title">Die Zielarchitektur des Kurses</title>
<desc id="p0c1-architecture-de-desc">Vier Schichten übereinander, daneben eine Spalte für die Automatisierung. Die Infrastruktur besteht aus dem Front-end und zwei Knoten mit Ubuntu auf smartlearn oder einem eigenen Hypervisor. Darauf stellt OpenNebula die IaaS bereit, mit oned, Sunstone, Mandanten und Netzen, die VMs laufen mit KVM auf den Knoten. Darüber läuft die Plattform k3s mit Argo CD, den Apps der Mitglieder, Prometheus, Loki, Ollama, Grafana mit Alertmanager und der KI-Triage. Zuoberst nutzen die Mitglieder von Wolkenwerk Bern die Cloud. Ansible mit OneDeploy baut die IaaS, OpenTofu legt die VMs von k3s an, Argo CD holt die Apps aus dem Git-Repo. Links steht bei jeder Schicht der Teil des Kurses, der sie aufbaut.</desc>
