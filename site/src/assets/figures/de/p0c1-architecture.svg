<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 684" role="img" aria-labelledby="p0c1-architecture-de-title p0c1-architecture-de-desc">
<title id="p0c1-architecture-de-title">Die Zielarchitektur des Kurses</title>
<desc id="p0c1-architecture-de-desc">Vier Schichten übereinander. Die Infrastruktur besteht aus dem Front-end und zwei Knoten mit Ubuntu auf smartlearn oder einem eigenen Hypervisor, eingerichtet mit prepare.sh. Darauf stellt OpenNebula die IaaS bereit, mit oned, Sunstone, Mandanten und Netzen, installiert mit Ansible und OneDeploy, die VMs laufen mit KVM auf den Knoten. Darüber läuft die Plattform k3s, von OpenTofu angelegt, mit Argo CD, Prometheus, Grafana, Loki, dem Webshop, Ollama und der KI-Triage. Die Apps holt Argo CD aus einem Git-Repo. Ollama und die KI-Triage sind mit «Zusatz» markiert, weil du sie in den Zusatzaufträgen von Teil 5 baust. Zuoberst nutzen die Mitglieder von Wolkenwerk Bern die Cloud, das fünfte entwirfst du in einem Zusatzauftrag von Meilenstein 4. Jede Schicht nennt die Teile des Kurses, die sie aufbauen.</desc>
