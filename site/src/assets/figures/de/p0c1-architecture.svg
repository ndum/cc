<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="p0c1-architecture-de-title p0c1-architecture-de-desc">
<title id="p0c1-architecture-de-title">Die Zielarchitektur des Kurses</title>
<desc id="p0c1-architecture-de-desc">Fünf Schichten übereinander. Unten laufen drei Lab-VMs mit Ubuntu auf SmartLearn oder Hyper-V. Darauf stellt OpenNebula die IaaS bereit, mit der API von oned, der Weboberfläche, Mandanten mit Quotas und einem internen Netz. Darüber läuft die Plattform k3s auf zwei VMs, per OpenTofu bereitgestellt, mit Argo CD, den Apps der Mitglieder, Prometheus, Loki und Ollama. Zuoberst nutzen die Mitglieder von Wolkenwerk Bern die Cloud. Neben jeder Schicht steht der Teil des Kurses, der sie aufbaut.</desc>
