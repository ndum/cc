<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="p0c2-lab-de-title p0c2-lab-de-desc">
<title id="p0c2-lab-de-title">Das Lab mit drei Servern, dem Client und zwei Netzen</title>
<desc id="p0c2-lab-de-desc">Front-end, zwei Knoten und der Client hängen im Labnetz 192.168.210.0/24, hier mit den Beispieladressen von mmuster. Das Labnetz erreicht das Internet über das Gateway .1. Vom Client aus erreichst du die Server per SSH und ihre Weboberflächen im Browser. Auf jedem Knoten laufen VMs der Cloud. Diese VMs und das Front-end teilen ein internes VXLAN-Netz. Das Front-end ist dessen Gateway und leitet den Verkehr mit NAT ins Internet.</desc>
