<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 284" role="img" aria-labelledby="p1c1-characteristics-de-title p1c1-characteristics-de-desc">
<title id="p1c1-characteristics-de-title">Die fünf Merkmale einer Cloud bei Wolkenwerk Bern</title>
<desc id="p1c1-characteristics-de-desc">In der Mitte steht die Cloud von Wolkenwerk Bern auf drei Servern. Fünf Karten rundherum zeigen die Merkmale einer Cloud nach NIST mit je einem Beispiel aus dem Lab. Ein Mitglied startet selbst eine VM in Sunstone (On-demand self-service). Weboberfläche, API und SSH sind über das Netz erreichbar (Broad network access). Alle Mitglieder teilen sich einen Pool (Resource pooling). Der Webshop skaliert unter Last (Rapid elasticity). Der Showback zeigt jedem Mitglied seinen Verbrauch (Measured service). Erst mit allen fünf Merkmalen bilden die drei Server eine Cloud.</desc>
