<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 402" role="img" aria-labelledby="p1c2-responsibility-de-title p1c2-responsibility-de-desc">
<title id="p1c2-responsibility-de-title">Geteilte Verantwortung in den Servicemodellen</title>
<desc id="p1c2-responsibility-de-desc">Vier Spalten für den eigenen Betrieb, IaaS, PaaS und SaaS zeigen neun Schichten von Netz und Hardware bis zu Daten und Zugriffen. Im eigenen Betrieb betreiben die Nutzenden alle Schichten. Bei IaaS übernimmt der Anbieter Netz, Speicher, Server und Virtualisierung, bei PaaS zusätzlich Betriebssystem, Middleware und Laufzeit, bei SaaS auch die Anwendung. Daten und Zugriffe bleiben immer bei den Nutzenden.</desc>
