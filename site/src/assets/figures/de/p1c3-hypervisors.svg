<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-labelledby="p1c3-hypervisors-de-title p1c3-hypervisors-de-desc">
<title id="p1c3-hypervisors-de-title">Hypervisoren und verschachtelte Virtualisierung</title>
<desc id="p1c3-hypervisors-de-desc">Drei Stapel nebeneinander, jeder steht auf seiner Hardware. Ein Hypervisor vom Typ 1 wie ESXi, Hyper-V oder KVM läuft direkt auf der Hardware. Die VMs laufen darauf. Ein Hypervisor vom Typ 2 wie VirtualBox oder VMware Workstation läuft als Programm in einem Betriebssystem. Im Lab sind drei Ebenen verschachtelt. Auf smartlearn oder einem eigenen Hypervisor laufen die Knoten als VMs. Auf den Knoten führt KVM die VMs deiner Cloud aus. Die Knoten sind also VMs und zugleich Hypervisoren.</desc>
