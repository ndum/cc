<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" role="img" aria-labelledby="p2c1-architecture-de-title p2c1-architecture-de-desc">
<title id="p2c1-architecture-de-title">Die Bausteine von OpenNebula</title>
<desc id="p2c1-architecture-de-desc">Die Bausteine von OpenNebula in drei Bereichen übereinander. Oben greifen Sunstone, die CLI und OpenTofu über die API auf Port 2633 auf oned zu. In der Mitte verwaltet oned auf dem Front-end alle Objekte, speichert sie in MariaDB, lässt den Scheduler Knoten wählen und erhält Zustände von onemonitord. Die Treiber für Hosts, VMs, Transfer, Netze und Datastores führen die Aufträge aus. Unten arbeiten die beiden Knoten mit libvirt und KVM. Ihr Datastore 0 hält die Disks laufender VMs. Achte darauf, dass auf den Knoten kein Dienst von OpenNebula läuft. Die Treiber erreichen sie über SSH.</desc>
