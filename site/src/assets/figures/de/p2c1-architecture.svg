<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 284" role="img" aria-labelledby="p2c1-architecture-de-title p2c1-architecture-de-desc">
<title id="p2c1-architecture-de-title">Die Bausteine von OpenNebula</title>
<desc id="p2c1-architecture-de-desc">Drei Bereiche nebeneinander. Links greifen Sunstone, die CLI und OpenTofu über die API auf das Front-end zu. In der Mitte verwaltet oned auf dem Front-end alle Objekte, speichert sie in MariaDB, lässt den Scheduler Knoten wählen und erhält Zustände von onemonitord. Die Treiber für Hosts, VMs, Transfer, Netze und Datastores führen die Aufträge aus. Rechts arbeiten die Knoten mit libvirt und KVM, die Treiber erreichen sie über SSH.</desc>
