<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="p2c2-deploy-de-title p2c2-deploy-de-desc">
<title id="p2c2-deploy-de-title">OneDeploy richtet das Lab ein</title>
<desc id="p2c2-deploy-de-desc">Ansible auf dem Front-end liest das Inventar und die Playbooks von OneDeploy. Es richtet das Front-end lokal ein, mit oned, Scheduler und FireEdge. Die beiden Knoten richtet es über SSH ein, mit KVM und libvirt.</desc>
