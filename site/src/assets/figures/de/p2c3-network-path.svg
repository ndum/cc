<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" role="img" aria-labelledby="p2c3-network-path-de-title p2c3-network-path-de-desc">
<title id="p2c3-network-path-de-title">Der Weg eines Pakets von der VM ins Internet</title>
<desc id="p2c3-network-path-de-desc">Der Weg eines Pakets von einer VM ins Internet. Links schickt eine VM im Netz cc-net auf Knoten 1 ihren Rahmen an die Bridge ccbr mit deiner Kennung und weiter ins VXLAN. In der Mitte reist der Rahmen im Labnetz in einem UDP-Paket an Port 8472. Rechts packt cc-vxlan auf dem Front-end den Rahmen aus und gibt ihn an die Bridge cc-br mit der Adresse des Gateways. Die NAT-Regel in der nftables-Tabelle cc_gateway ersetzt die Absenderadresse. Danach geht das Paket über das Labnetz ins Internet. Unten steht der Aufbau eines Pakets im Labnetz. Der Kopf von VXLAN und das äussere Paket brauchen 36 Byte, der Ethernet-Kopf im Rahmen der VM weitere 14. Für das IP-Paket der VM bleiben so höchstens 1450 der 1500 Byte, darum die MTU 1450. Achte darauf, dass von der Cloud im Labnetz nur Front-end und Knoten sichtbar sind.</desc>
