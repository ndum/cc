<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="p3c1-tenants-de-title p3c1-tenants-de-desc">
<title id="p3c1-tenants-de-title">Gruppen, Gruppenadmins und das VDC der Mitglieder</title>
<desc id="p3c1-tenants-de-desc">Oben fasst das VDC wolkenwerk die vier Gruppen praxis, treuhand, velo und gemeinde zusammen, eine pro Mitglied. Jede Gruppe hat einen Gruppenadmin wie praxis-admin, der in seiner Gruppe Benutzer anlegt. Jede Gruppe darf VMs, Images, Vorlagen und Dokumente anlegen und sieht nur ihre eigenen Objekte. Unten ist der Cluster 0 mit Knoten 1, Knoten 2, dem Netz cc-net und den Datastores, den das Plattform-Team dem VDC zuteilt.</desc>
