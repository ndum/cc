<text class="d-code" x="92.8528" y="40" text-anchor="start">praxis</text>
<text class="d-meta" x="728" y="40" text-anchor="end">praxis-1 und praxis-2 aus der Vorlage ubuntu</text>
<rect class="d-shadow" x="32" y="57.5" width="696" height="120" rx="10"/>
<rect class="d-tile" x="32" y="56" width="696" height="120" rx="10"/>
<text class="d-title" x="48" y="80" text-anchor="start">CPU</text>
<text class="d-meta" x="84.1112" y="80" text-anchor="start">in Kernen</text>
<path class="d-grid" d="M 152 90 L 152 152"/>
<text class="d-meta" x="152" y="166" text-anchor="middle">0</text>
<path class="d-grid" d="M 240 90 L 240 152"/>
<text class="d-meta" x="240" y="166" text-anchor="middle">0,5</text>
