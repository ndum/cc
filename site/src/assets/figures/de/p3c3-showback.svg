<rect class="d-tile" x="280" y="52" width="196" height="60" rx="10"/>
<g class="d-icon" transform="translate(292 73) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M14.5 9c-.5-1-1.5-1.5-2.5-1.5-1.7 0-2.8 1-2.8 2.2 0 2.9 5.6 1.6 5.6 4.5 0 1.2-1.2 2.3-2.8 2.3-1.1 0-2.2-.6-2.7-1.6M12 6v1.5M12 16.5V18"/></g>
<text class="d-title" x="320" y="79" text-anchor="start">Vorlage ubuntu</text>
<text class="d-sub" x="320" y="95" text-anchor="start">aus costs.tpl</text>
