<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 308" role="img" aria-labelledby="p4c1-plan-apply-de-title p4c1-plan-apply-de-desc">
<title id="p4c1-plan-apply-de-title">Plan und Apply mit dem State</title>
<desc id="p4c1-plan-apply-de-desc">Links liegt der Code in Git als Soll-Zustand, rechts der Ist-Zustand in OpenNebula. tofu plan liest den Code, den State in terraform.tfstate und den Ist-Zustand und zeigt nur, was sich ändern würde. tofu apply liest den Code, ändert die VMs über die API von OpenNebula und schreibt danach den State. Ganz rechts ändert jemand eine VM von Hand in Sunstone oder mit der CLI. Achte darauf, dass nur apply etwas ändert und dass der nächste Plan diese Drift zeigt, weil er den Ist-Zustand liest.</desc>
