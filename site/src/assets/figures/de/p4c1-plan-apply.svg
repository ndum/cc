<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 308" role="img" aria-labelledby="p4c1-plan-apply-de-title p4c1-plan-apply-de-desc">
<title id="p4c1-plan-apply-de-title">Plan und Apply mit dem State</title>
<desc id="p4c1-plan-apply-de-desc">Links liegt der Code in Git als Soll-Zustand. tofu plan liest den Code, den State in terraform.tfstate und den Ist-Zustand in OpenNebula und zeigt die Unterschiede. tofu apply liest den Code, ändert die VMs in OpenNebula und schreibt den State. Rechts ändert jemand eine VM von Hand in Sunstone oder mit der CLI, diese Drift zeigt der nächste Plan.</desc>
