<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 172" role="img" aria-labelledby="p4c2-memory-de-title p4c2-memory-de-desc">
<title id="p4c2-memory-de-title">Der Speicher eines Knotens</title>
<desc id="p4c2-memory-de-desc">Ein Balken zeigt die 8 GB eines Knotens. 0,8 GB behalten Kernel und Firmware, die übrigen 7,2 GB meldet OpenNebula für VMs, ohne abzuziehen, was der Knoten selbst braucht. Davon reserviert die k3s-VM 6 GB, auf einem Knoten der Server, auf dem anderen der Agent. Laut OpenNebula bleiben 1,2 GB frei, davon braucht das System des Knotens rund 0,6 GB. Achte darauf, dass eine weitere VM mit 1 GB nur dank dem Swap des Knotens Platz hat.</desc>
<defs><marker id="p4c2-memory-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p4c2-memory-de-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="800" height="172" rx="14"/>
<rect class="d-band d-band-2" x="16" y="16" width="768" height="140" rx="12"/>
<text class="d-label d-label-blue" x="32" y="40" text-anchor="start">KNOTEN 1 ODER KNOTEN 2</text>
<text class="d-meta" x="764" y="40" text-anchor="end">8 GB Arbeitsspeicher</text>
<rect class="d-shadow" x="44" y="57.5" width="66" height="50" rx="10"/>
<rect class="d-tile" x="44" y="56" width="66" height="50" rx="10"/>
<text class="d-title" x="77" y="78" text-anchor="middle">Kernel</text>
<text class="d-sub" x="77" y="94" text-anchor="middle">0,8 GB</text>
<rect class="d-shadow" x="116" y="57.5" width="534" height="50" rx="10"/>
<rect class="d-tile d-tile-violet" x="116" y="56" width="534" height="50" rx="10"/>
<g class="d-icon d-icon-violet" transform="translate(128 72) scale(0.75)"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8.5" y="8.5" width="7" height="7" rx="1"/></g>
<text class="d-title d-title-violet" x="156" y="78" text-anchor="start">k3s-VM</text>
<text class="d-sub" x="156" y="94" text-anchor="start">6 GB, k3s-server oder k3s-agent</text>
<rect class="d-strip" x="656" y="56" width="108" height="50" rx="10"/>
<text class="d-title" x="710" y="78" text-anchor="middle">frei</text>
<text class="d-sub" x="710" y="94" text-anchor="middle">1,2 GB</text>
<path class="d-line" d="M 116 114 L 116 120 L 764 120 L 764 114"/>
<text class="d-sub" x="440" y="140" text-anchor="middle">7,2 GB für VMs, <tspan class="d-code">ALLOCATED_MEM</tspan> in <tspan class="d-code">onehost list</tspan>, ohne den Bedarf des Knotens</text>
</svg>
