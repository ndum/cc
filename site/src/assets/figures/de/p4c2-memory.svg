<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" role="img" aria-labelledby="p4c2-memory-de-title p4c2-memory-de-desc">
<title id="p4c2-memory-de-title">Der Speicher eines Knotens</title>
<desc id="p4c2-memory-de-desc">Ein Balken zeigt die 8 GB eines Knotens. 0,8 GB bleiben dem Host, die übrigen 7,2 GB meldet OpenNebula für VMs. Davon reserviert die k3s-VM 6 GB, auf einem Knoten der Server, auf dem anderen der Agent. Frei bleiben 1,2 GB. Achte darauf, dass daneben nur noch eine VM mit 1 GB Platz hat, weil OpenNebula den ganzen Speicher jeder VM reserviert.</desc>
<defs><marker id="p4c2-memory-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p4c2-memory-de-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="760" height="172" rx="14"/>
<rect class="d-band d-band-2" x="16" y="16" width="728" height="140" rx="12"/>
<text class="d-label d-label-blue" x="32" y="40" text-anchor="start">KNOTEN 1 ODER KNOTEN 2</text>
<text class="d-meta" x="716" y="40" text-anchor="end">8 GB Arbeitsspeicher</text>
<rect class="d-shadow" x="44" y="57.5" width="61.2" height="50" rx="10"/>
<rect class="d-tile" x="44" y="56" width="61.2" height="50" rx="10"/>
<text class="d-title" x="74.6" y="78" text-anchor="middle">Host</text>
<text class="d-sub" x="74.6" y="94" text-anchor="middle">0,8 GB</text>
<rect class="d-shadow" x="111.2" y="57.5" width="498.00000000000006" height="50" rx="10"/>
<rect class="d-tile d-tile-violet" x="111.2" y="56" width="498.00000000000006" height="50" rx="10"/>
<g class="d-icon d-icon-violet" transform="translate(123.2 72) scale(0.75)"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8.5" y="8.5" width="7" height="7" rx="1"/></g>
<text class="d-title d-title-violet" x="151.2" y="78" text-anchor="start">k3s-VM</text>
<text class="d-sub" x="151.2" y="94" text-anchor="start">6 GB, k3s-server oder k3s-agent</text>
<rect class="d-strip" x="615.2" y="56" width="100.79999999999995" height="50" rx="10"/>
<text class="d-title" x="665.6" y="78" text-anchor="middle">frei</text>
<text class="d-sub" x="665.6" y="94" text-anchor="middle">1,2 GB</text>
<path class="d-line" d="M 111.2 114 L 111.2 120 L 716 120 L 716 114"/>
<text class="d-sub" x="413.6" y="140" text-anchor="middle">7,2 GB für VMs, <tspan class="d-code">ALLOCATED_MEM</tspan> in <tspan class="d-code">onehost list</tspan></text>
</svg>
