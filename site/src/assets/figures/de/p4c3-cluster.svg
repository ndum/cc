<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 346" role="img" aria-labelledby="p4c3-cluster-de-title p4c3-cluster-de-desc">
<title id="p4c3-cluster-de-title">Der k3s-Cluster in cc-net</title>
<desc id="p4c3-cluster-de-desc">Zwei VMs im internen Netz cc-net. k3s-server mit der Adresse CC_K3S_SERVER_IP enthält die Control Plane mit API-Server auf Port 6443 und der Datenbank SQLite und führt auch Pods aus. k3s-agent mit der Adresse CC_K3S_AGENT_IP tritt mit dem Token bei und führt Pods aus. Jeder Node bekommt für seine Pods ein /24 aus 10.52.0.0/16, die Services liegen in 10.53.0.0/16. Mit host-gw hat jeder Node eine Route ins Pod-Netz des anderen über dessen Adresse in cc-net. kubectl auf dem Front-end spricht mit dem API-Server.</desc>
<defs><marker id="p4c3-cluster-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-band d-band-1" x="16" y="16" width="160" height="314" rx="6"/>
<text class="d-label" x="28" y="40" text-anchor="start">FRONT-END</text>
<rect class="d-tile" x="28" y="96" width="136" height="46" rx="4"/>
