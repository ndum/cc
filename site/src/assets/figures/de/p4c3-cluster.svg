<text class="d-label" x="232" y="40" text-anchor="start">CC-NET</text>
<text class="d-meta" x="768" y="40" text-anchor="end">CC_GUEST_NET in 172.16.0.0/12</text>
<rect class="d-band d-band-2" x="232" y="56" width="268" height="212" rx="6"/>
<text class="d-label" x="248" y="80" text-anchor="start">K3S-SERVER</text>
<text class="d-meta" x="484" y="80" text-anchor="end">CC_K3S_SERVER_IP</text>
