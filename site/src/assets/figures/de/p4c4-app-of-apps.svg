<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 286" role="img" aria-labelledby="p4c4-app-of-apps-de-title p4c4-app-of-apps-de-desc">
<title id="p4c4-app-of-apps-de-title">App of Apps im Plattform-Repo</title>
<desc id="p4c4-app-of-apps-de-desc">Die Application root wird einmal beim Bootstrap angewendet und zeigt auf den Ordner apps. Darin liegen die Application webshop, die den Ordner webshop in den Namespace velo bringt, und das ApplicationSet members. Das ApplicationSet erzeugt für jeden Ordner unter members eine Application, etwa member-velo und member-gemeinde.</desc>
