<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" role="img" aria-labelledby="p4c4-gitops-de-title p4c4-gitops-de-desc">
<title id="p4c4-gitops-de-title">Der Kreislauf von GitOps</title>
<desc id="p4c4-gitops-de-desc">Das Plattform-Team schickt eine Änderung mit git push an Gitea auf dem Front-end oder öffnet einen Pull Request, der nach der Prüfung zusammengeführt wird. Argo CD im k3s-Cluster holt das Repo wolkenwerk/platform jede Minute mit Leserechten. Es vergleicht den Soll-Zustand aus Git mit dem Ist-Zustand und wendet die Unterschiede an, etwa beim Webshop im Namespace velo. Ändert jemand den Cluster von Hand mit kubectl scale, setzt Self-Heal die Änderung zurück. Achte auf die Richtung der Pfeile. Argo CD holt sich den Soll-Zustand selbst, niemand schickt ihn in den Cluster.</desc>
