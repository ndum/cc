<text class="d-title" x="558" y="41" text-anchor="start">Burn Rate 14,4</text>
<text class="d-sub" x="558" y="57" text-anchor="start">Budget nach 12 Stunden weg</text>
<rect class="d-band d-band-1" x="16" y="96" width="728" height="256" rx="12"/>
<text class="d-label" x="32" y="120" text-anchor="start">BURN RATE IM KURZEN UND IM LANGEN FENSTER</text>
<text class="d-meta" x="728" y="120" text-anchor="end">schematisch, bei gleichmässigem Verkehr</text>
