<text class="d-title" x="307" y="41" text-anchor="start">Fehlerbudget 0,5 %</text>
<text class="d-sub" x="307" y="57" text-anchor="start">der Anfragen dürfen scheitern</text>
<rect class="d-shadow" x="518" y="17.5" width="226" height="56" rx="10"/>
