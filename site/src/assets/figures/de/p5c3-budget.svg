<text class="d-sub" x="56" y="57" text-anchor="start">ohne Serverfehler, 7 Tage</text>
<rect class="d-shadow" x="267" y="17.5" width="226" height="56" rx="10"/>
<rect class="d-tile" x="267" y="16" width="226" height="56" rx="10"/>
