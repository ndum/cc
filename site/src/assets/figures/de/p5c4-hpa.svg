<rect class="d-band d-band-1" x="16" y="308" width="728" height="108" rx="12"/>
<text class="d-label" x="32" y="332" text-anchor="start">GRENZE</text>
<path class="d-line d-dashed" d="M 148 344 L 148 264"/>
<text class="d-sub" x="156" y="300" text-anchor="start">begrenzt</text>
<rect class="d-shadow" x="32" y="345.5" width="696" height="56" rx="10"/>
<rect class="d-tile" x="32" y="344" width="696" height="56" rx="10"/>
<g class="d-icon" transform="translate(44 363) scale(0.75)"><path d="M12 3 19 6v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z"/></g>
<text class="d-title" x="72" y="369" text-anchor="start">ResourceQuota member</text>
<text class="d-sub" x="72" y="385" text-anchor="start">limits.cpu 2, sechs Pods brauchen 1,5 CPU, der Rest bleibt für einen Rollout</text>
