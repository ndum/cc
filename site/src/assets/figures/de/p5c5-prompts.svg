<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="p5c5-prompts-de-title p5c5-prompts-de-desc">
<title id="p5c5-prompts-de-title">Zwei Fassungen der Frage im Vergleich</title>
<desc id="p5c5-prompts-de-desc">Der Zielzustand von Auftrag C. Oben links stehen im Plattform-Repo zwei Fassungen der Frage, ein Commit führt von der bisherigen zur verbesserten. Oben rechts löst du den echten Fehler über Git aus und hältst den Alert mit seinem Kontext fest. Im Cluster k3s schickt der Triage-Dienst aus Auftrag B in jedem Durchlauf denselben Alert mit einer der beiden Fassungen an das Sprachmodell aus Auftrag A, mehrmals für jede Fassung. Zu jeder Antwort hältst du die Dauer fest und ob Ursache und Aktion zum echten Fehler passen. Die Auswertung zeigt, was die neue Fassung verbessert hat, was nicht und welche Grenze bleibt. Achte darauf, dass sich zwischen den Durchläufen nur die Fassung der Frage ändert.</desc>
