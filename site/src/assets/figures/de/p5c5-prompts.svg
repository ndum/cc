<text class="d-title" x="72" y="305" text-anchor="start">Jeder Durchlauf</text>
<text class="d-sub" x="72" y="321" text-anchor="start">Dauer und ob Ursache und Aktion zum echten Fehler passen</text>
<rect class="d-shadow" x="520" y="281.5" width="208" height="56" rx="10"/>
<rect class="d-tile d-tile-accent" x="520" y="280" width="208" height="56" rx="10"/>
