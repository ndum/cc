<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 366" role="img" aria-labelledby="p5c6-triage-de-title p5c6-triage-de-desc">
<title id="p5c6-triage-de-title">Der Ablauf der Triage</title>
<desc id="p5c6-triage-de-desc">Prometheus wertet die Regel WebshopErrorBudgetBurn aus und schickt den Alert an Alertmanager. Alertmanager leitet Alerts, deren alertname mit Webshop beginnt, als Webhook an den Triage-Dienst im Namespace ai. Der Dienst holt die Fehlerzeilen der letzten 15 Minuten aus Loki und den Zustand des Deployments aus der Kubernetes-API und fragt Ollama mit llama3.2:3b. Den Vorschlag zeigt er auf einer Webseite an Port 30880. Ein Mensch gibt ihn mit seinem Namen frei oder lehnt ihn ab. Nur eine freigegebene Aktion läuft, nur restart und nur auf velo/webshop. Jeder Schritt landet im Audit-Log.</desc>
