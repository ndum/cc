<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 312" role="img" aria-labelledby="p6c2-backup-de-title p6c2-backup-de-desc">
<title id="p6c2-backup-de-title">Wo die Daten liegen und wie sie gesichert sind</title>
<desc id="p6c2-backup-de-desc">Links der Cluster k3s und die Knoten. etcd auf k3s-server schreibt alle sechs Stunden einen Snapshot und behält acht davon. Ein Timer kopiert die Snapshots alle sechs Stunden nach ~/backup/k3s auf dem Front-end, zusammen mit dem Token von k3s und dem Schlüssel von Sealed Secrets. Die Volumes auf k3s-agent mit Metriken, Logs und Audit-Log sind nicht gesichert. Die VMs der Mitglieder liegen in den Datastores der Knoten, ein Backup-Job sichert sie jede Nacht um 2 Uhr in den Backup-Datastore backups auf dem Front-end und behält sieben Backups. Auf dem Front-end liegen auch das Repo platform in Gitea und die Arbeitskopie ~/platform mit dem State von OpenTofu. Eine Kopie ausser Haus fehlt, darum verletzt das Lab die Regel 3-2-1. Fällt das Front-end aus, ist alles zugleich weg.</desc>
