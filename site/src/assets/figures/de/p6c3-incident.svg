<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 272" role="img" aria-labelledby="p6c3-incident-de-title p6c3-incident-de-desc">
<title id="p6c3-incident-de-title">Die Zeitlinie einer Störung</title>
<desc id="p6c3-incident-de-desc">Eine Störung auf einer Zeitachse in fünf Phasen. Nach ihrem Beginn erkennt Prometheus die Störung und schickt einen Alert. Danach ordnet das Team die Störung mit den Logs in Loki und den letzten Commits in Git ein. Es behebt sie mit git revert, das Argo CD ausrollt, bis der Dienst wieder läuft. Dann informiert es die betroffenen Mitglieder und schreibt später ein Postmortem ohne Schuldzuweisung mit Zeitlinie und Massnahmen. Unter der Achse stehen die Zeit bis zum Alert und die Zeit bis zur Wiederherstellung. Der Mittelwert der Zeit bis zur Wiederherstellung über viele Störungen ist die MTTR.</desc>
