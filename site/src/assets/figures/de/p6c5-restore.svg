<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 428" role="img" aria-labelledby="p6c5-restore-de-title p6c5-restore-de-desc">
<title id="p6c5-restore-de-title">Wiederherstellung aus einem Snapshot und SLA</title>
<desc id="p6c5-restore-de-desc">Oben das Front-end mit der Kopie der Snapshots und des Tokens in ~/backup/k3s und mit Gitea. Darunter der Cluster k3s. Aus der Kopie stellst du k3s-server wieder her, je nach Fehlerfall den bestehenden Server oder einen neuen. Danach holt Argo CD wieder Commits aus Gitea und rollt die Anwendung deines Mitglieds aus. Unten links deine Messung für den Fehlerfall, den du gewählt hast, auf einer Zeitachse. Start und Ende legst du selbst fest, dazwischen hältst du Zwischenzeiten fest. Die gemessene Zeit geht in das SLA für dein Mitglied ein. Darin folgt die Verfügbarkeit aus der Architektur, das RPO aus den Sicherungen und das RTO aus deiner Messung und den Supportzeiten.</desc>
