<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-labelledby="ex-kubernetes-en-title ex-kubernetes-en-desc">
<title id="ex-kubernetes-en-title">The objects of the web shop</title>
<desc id="ex-kubernetes-en-desc">All objects live in the namespace velo. At the top the path of a request. Traefik carries out the ingress webshop, which sends every path to the port http of the service webshop. The service has a fixed address in the cluster and port 80. Through its selector app=webshop, Kubernetes fills the EndpointSlice with the addresses of the ready pods, and the request goes to port 8080 of one of these pods. In the middle the two pods webshop-7d4f56cb9b-chxkw and webshop-7d4f56cb9b-mjsjj. At the bottom the deployment webshop. It manages the ReplicaSet webshop-7d4f56cb9b, which selects its two pods with app=webshop and pod-template-hash and keeps them running. Notice that the service, the ReplicaSet and the deployment find their pods through the label app=webshop without knowing their names.</desc>
