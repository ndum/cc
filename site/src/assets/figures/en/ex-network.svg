<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" role="img" aria-labelledby="ex-network-en-title ex-network-en-desc">
<title id="ex-network-en-title">Bridges and VXLAN in the lab</title>
<desc id="ex-network-en-desc">On the left the front-end, on the right node 1 with two VMs. On both, eth0 has an MTU of 1500 and an address on the lab network. On the front-end, cc-gateway creates the bridge cc-br with the gateway 172.31.160.1/24 and in it the VXLAN device cc-vxlan, both with an MTU of 1450. The kernel forwards packets from cc-net to eth0 with ip_forward=1, and the table cc_gateway replaces their source with 192.168.210.137. On the node, OpenNebula creates the bridge ccbr5862 without an address and in it the VXLAN device eth0.5862. The kernel gives that device the MTU of eth0 minus 50 bytes, which is 1450. The VM NICs such as one-12-0 join the same bridge, and libvirt gives them the MTU of the bridge. The VMs themselves get 1450 through the context. The two VXLAN devices join the bridges into the network cc-net. They wrap the frames in UDP packets to port 8472 and find each other through the multicast group 239.0.22.230 on the lab network. Notice that the bridge on the node has no address. Of the servers, only the front-end has an address in cc-net.</desc>
