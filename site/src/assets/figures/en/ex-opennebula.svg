<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 574" role="img" aria-labelledby="ex-opennebula-en-title ex-opennebula-en-desc">
<title id="ex-opennebula-en-title">Services and drivers of OpenNebula</title>
<desc id="ex-opennebula-en-desc">At the top the services on the front-end. FireEdge serves Sunstone on port 2616, and guacd on port 4822 brings the console of a VM into the browser. OneFlow runs on port 2474, OneGate on port 5030. Like the CLI and OpenTofu, FireEdge, OneFlow and OneGate call the oned API, through XML-RPC on port 2633 or gRPC on port 2634. oned stores every object as XML in MariaDB and hands the work to its drivers, which run as oneadmin like oned. The scheduler and the datastore driver only work on the front-end. The drivers for virtualization and transfer reach the nodes over SSH. There their scripts sit in /var/tmp/one/, copied from /var/lib/one/remotes/ on the front-end. vmm/kvm starts the VMs with libvirt and KVM, and vnm/vxlan sets up their network. The transfer driver puts disk.0 and disk.1 into datastore 0. An agent runs the probes from im/kvm-probes.d/ and sends the values to onemonitord on port 4124. Notice that no OpenNebula service runs on the nodes. Only scripts work there, started by the front-end over SSH.</desc>
