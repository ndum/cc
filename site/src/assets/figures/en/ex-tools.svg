<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" role="img" aria-labelledby="ex-tools-en-title ex-tools-en-desc">
<title id="ex-tools-en-title">The tools of the platform</title>
<desc id="ex-tools-en-desc">At the top the front-end with Helm, Gitea and kubeseal. Helm installs Argo CD once with bootstrap-argocd.sh into the namespace argocd. Argo CD polls your platform repo in Gitea every minute. It renders folders such as webshop/ and members/ with Kustomize, which brings the web shop and the members into the namespaces velo and gemeinde. It renders charts with Helm, which brings Prometheus, Alertmanager, Grafana, Loki and Alloy into the namespace monitoring and the Sealed Secrets controller into kube-system. kubeseal encrypts a Secret, and seal-secrets.sh puts it into your repo as a SealedSecret. Notice that Helm on the front-end only installs Argo CD. Argo CD brings everything else from Git into the cluster.</desc>
