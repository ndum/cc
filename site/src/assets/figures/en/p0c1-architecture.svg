<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 684" role="img" aria-labelledby="p0c1-architecture-en-title p0c1-architecture-en-desc">
<title id="p0c1-architecture-en-title">The target architecture of the course</title>
<desc id="p0c1-architecture-en-desc">Four layers on top of each other. The infrastructure is the front-end and two nodes with Ubuntu on smartlearn or a hypervisor of your own, set up with prepare.sh. On it OpenNebula provides the IaaS with oned, Sunstone, tenants and networks, installed with Ansible and OneDeploy, and the VMs run with KVM on the nodes. Above that runs the platform k3s, created by OpenTofu, with Argo CD, Prometheus, Grafana, Loki, the web shop, Ollama and the AI triage, and Argo CD pulls the apps from a Git repo. Ollama and the AI triage are marked as advanced because you build them in the advanced tasks of part 5. At the top the members of Wolkenwerk Bern use the cloud. Every layer names the parts of the course that build it.</desc>
