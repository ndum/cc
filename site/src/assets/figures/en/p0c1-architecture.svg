<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 582" role="img" aria-labelledby="p0c1-architecture-en-title p0c1-architecture-en-desc">
<title id="p0c1-architecture-en-title">The target architecture of the course</title>
<desc id="p0c1-architecture-en-desc">Four layers on top of each other with a column for automation next to them. The infrastructure is the front-end and two nodes with Ubuntu on SmartLearn or Hyper-V. On it, OpenNebula provides the IaaS with oned, Sunstone, tenants and networks, and the VMs run with KVM on the nodes. Above that runs the platform k3s with Argo CD, the apps of the members, Prometheus, Loki, Ollama, Grafana with Alertmanager and the AI triage. At the top, the members of Wolkenwerk Bern use the cloud. Ansible with OneDeploy builds the IaaS, OpenTofu creates the VMs of k3s, and Argo CD pulls the apps from the Git repo. On the left, each layer shows the part of the course that builds it.</desc>
