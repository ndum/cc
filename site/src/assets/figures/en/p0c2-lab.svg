<path class="d-line d-line-accent d-dashed" d="M 642 218 L 642 300"/>
<path class="d-line d-line-accent d-dashed" d="M 140 300 L 642 300"/>
<text class="d-sub" x="40" y="326" text-anchor="start">internal network (VXLAN), for example 172.28.217.0/24</text>
