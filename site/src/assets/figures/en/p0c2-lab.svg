<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="p0c2-lab-en-title p0c2-lab-en-desc">
<title id="p0c2-lab-en-title">The lab with three VMs and two networks</title>
<desc id="p0c2-lab-en-desc">The front-end and two nodes sit on the lab network with fixed addresses. VMs of the cloud run on every node. These VMs and the front-end share an internal VXLAN network. The front-end is its gateway and forwards its traffic to the internet with NAT.</desc>
<defs><marker id="p0c2-lab-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-tile" x="40" y="20" width="200" height="40" rx="6"/>
<text class="d-title" x="140" y="44.5" text-anchor="middle">Internet</text>
<path class="d-arrow" d="M 140 140 L 140 64" marker-end="url(#p0c2-lab-en-head)"/>
<text class="d-code" x="150" y="106" text-anchor="start">NAT</text>
<path class="d-line" d="M 190 116 L 620 116"/>
<path class="d-line" d="M 190 116 L 190 140"/>
<path class="d-line" d="M 380 116 L 380 140"/>
<path class="d-line" d="M 600 116 L 600 140"/>
<text class="d-sub" x="620" y="108" text-anchor="end">lab network, fixed addresses</text>
<rect class="d-tile d-tile-accent" x="40" y="140" width="200" height="56" rx="6"/>
<text class="d-title" x="140" y="165" text-anchor="middle">Front-end</text>
<text class="d-sub" x="140" y="181" text-anchor="middle">gateway, web interface</text>
<rect class="d-band d-band-2" x="290" y="140" width="180" height="132" rx="10"/>
<text class="d-label" x="302" y="160" text-anchor="start">Node 1</text>
<text class="d-sub" x="458" y="160" text-anchor="end">KVM</text>
<rect class="d-tile" x="302" y="178" width="72" height="40" rx="6"/>
<text class="d-title" x="338" y="202.5" text-anchor="middle">VM</text>
<rect class="d-tile" x="386" y="178" width="72" height="40" rx="6"/>
<text class="d-title" x="422" y="202.5" text-anchor="middle">VM</text>
<rect class="d-band d-band-2" x="510" y="140" width="180" height="132" rx="10"/>
<text class="d-label" x="522" y="160" text-anchor="start">Node 2</text>
<text class="d-sub" x="678" y="160" text-anchor="end">KVM</text>
<rect class="d-tile" x="522" y="178" width="72" height="40" rx="6"/>
