<path class="d-line d-line-accent d-dashed" d="M 140 196 L 140 300"/>
<path class="d-line d-line-accent d-dashed" d="M 338 218 L 338 300"/>
<path class="d-line d-line-accent d-dashed" d="M 422 218 L 422 300"/>
