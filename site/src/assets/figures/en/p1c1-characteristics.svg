<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 284" role="img" aria-labelledby="p1c1-characteristics-en-title p1c1-characteristics-en-desc">
<title id="p1c1-characteristics-en-title">The five characteristics of a cloud at Wolkenwerk Bern</title>
<desc id="p1c1-characteristics-en-desc">The cloud of Wolkenwerk Bern on three servers sits in the middle. Five cards around it show the characteristics of a cloud according to NIST, each with an example from the lab. A member starts a VM in Sunstone on its own (On-demand self-service). The web interface, the API and SSH are reachable over the network (Broad network access). All members share one pool (Resource pooling). The web shop scales under load (Rapid elasticity). Showback shows every member its usage (Measured service). Only with all five characteristics do the three servers form a cloud.</desc>
