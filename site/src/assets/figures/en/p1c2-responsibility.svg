<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 402" role="img" aria-labelledby="p1c2-responsibility-en-title p1c2-responsibility-en-desc">
<title id="p1c2-responsibility-en-title">Shared responsibility in the service models</title>
<desc id="p1c2-responsibility-en-desc">Four columns for running it yourself, IaaS, PaaS and SaaS show nine layers from network and hardware up to data and access. Running it yourself, the users operate every layer. With IaaS the provider takes over network, storage, servers and virtualization, with PaaS also the operating system, middleware and runtime, with SaaS the application as well. Data and access always stay with the users.</desc>
