<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-labelledby="p1c3-hypervisors-en-title p1c3-hypervisors-en-desc">
<title id="p1c3-hypervisors-en-title">Hypervisors and nested virtualization</title>
<desc id="p1c3-hypervisors-en-desc">Three stacks side by side, each standing on its hardware. A type 1 hypervisor such as ESXi, Hyper-V or KVM runs directly on the hardware, and the VMs run on top of it. A type 2 hypervisor such as VirtualBox or VMware Workstation runs as a program inside an operating system. The lab nests three levels. The nodes run as VMs on smartlearn or on a hypervisor of your own, and on the nodes KVM runs the VMs of your cloud. The nodes are VMs and hypervisors at the same time.</desc>
