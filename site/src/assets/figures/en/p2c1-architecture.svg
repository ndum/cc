<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" role="img" aria-labelledby="p2c1-architecture-en-title p2c1-architecture-en-desc">
<title id="p2c1-architecture-en-title">The building blocks of OpenNebula</title>
<desc id="p2c1-architecture-en-desc">The building blocks of OpenNebula in three areas stacked on top of each other. At the top Sunstone, the CLI and OpenTofu reach oned through the API on port 2633. In the middle oned on the front-end manages all objects, stores them in MariaDB, lets the scheduler pick nodes and receives states from onemonitord. The drivers for hosts, VMs, transfer, networks and datastores carry out the jobs. At the bottom the two nodes work with libvirt and KVM, and their datastore 0 holds the disks of running VMs. Notice that no OpenNebula service runs on the nodes. The drivers reach them over SSH.</desc>
