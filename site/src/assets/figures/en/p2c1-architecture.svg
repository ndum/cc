<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 284" role="img" aria-labelledby="p2c1-architecture-en-title p2c1-architecture-en-desc">
<title id="p2c1-architecture-en-title">The building blocks of OpenNebula</title>
<desc id="p2c1-architecture-en-desc">Three areas side by side. On the left Sunstone, the CLI and OpenTofu reach the front-end through the API. In the middle oned on the front-end manages all objects, stores them in MariaDB, lets the scheduler pick nodes and receives states from onemonitord. The drivers for hosts, VMs, transfer, networks and datastores carry out the jobs. On the right the nodes work with libvirt and KVM, and the drivers reach them over SSH.</desc>
