<title id="p2c2-deploy-en-title">How OneDeploy sets up the lab</title>
<desc id="p2c2-deploy-en-desc">Ansible on the front-end reads the inventory and the playbooks of OneDeploy. It sets up the front-end locally, with oned, the scheduler and FireEdge, and the two nodes over SSH, with KVM and libvirt.</desc>
