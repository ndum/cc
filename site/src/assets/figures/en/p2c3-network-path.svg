<g class="d-icon d-icon-violet" transform="translate(44 159) scale(0.75)"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></g>
<text class="d-title d-title-violet" x="72" y="165" text-anchor="start">Bridge</text>
