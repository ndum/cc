<rect class="d-shadow" x="528" y="229.5" width="200" height="56" rx="10"/>
<rect class="d-tile d-tile-violet" x="528" y="228" width="200" height="56" rx="10"/>
<g class="d-icon d-icon-violet" transform="translate(540 247) scale(0.75)"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></g>
<text class="d-title d-title-violet" x="568" y="253" text-anchor="start">VXLAN</text>
<text class="d-code" x="568" y="269" text-anchor="start">cc-vxlan</text>
<rect class="d-shadow" x="268" y="53.5" width="200" height="56" rx="10"/>
<rect class="d-tile" x="268" y="52" width="200" height="56" rx="10"/>
<g class="d-icon" transform="translate(280 71) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></g>
<text class="d-title" x="308" y="77" text-anchor="start">Internet</text>
<text class="d-sub" x="308" y="93" text-anchor="start">over the lab network</text>
<rect class="d-band d-band-1" x="16" y="324" width="728" height="172" rx="12"/>
