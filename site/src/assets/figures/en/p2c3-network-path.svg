<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" role="img" aria-labelledby="p2c3-network-path-en-title p2c3-network-path-en-desc">
<title id="p2c3-network-path-en-title">The path of a packet from a VM to the internet</title>
<desc id="p2c3-network-path-en-desc">The path of a packet from a VM to the internet. On the left a VM in the network cc-net on node 1 hands its frame to the bridge ccbr with your identifier and on to the VXLAN. In the middle the frame crosses the lab network inside a UDP packet to port 8472. On the right cc-vxlan on the front-end unwraps the frame and passes it to the bridge cc-br, which holds the gateway address. The NAT rule in the nftables table cc_gateway replaces the source address, and the packet leaves over the lab network for the internet. At the bottom is the layout of a packet on the lab network. The VXLAN header and the outer packet take 36 bytes, and the Ethernet header inside the VM frame another 14. That leaves at most 1450 of the 1500 bytes for the IP packet of the VM, hence the MTU of 1450. Notice that of the cloud only the front-end and the nodes show up on the lab network.</desc>
<defs><marker id="p2c3-network-path-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p2c3-network-path-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="760" height="512" rx="14"/>
<defs><marker id="p2c3-network-path-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-fill-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-band d-band-2" x="16" y="16" width="208" height="284" rx="12"/>
