<rect class="d-band d-band-2" x="512" y="16" width="232" height="284" rx="12"/>
<text class="d-label d-label-blue" x="528" y="40" text-anchor="start">FRONT-END</text>
<text class="d-code" x="728" y="40" text-anchor="end">cc-gateway</text>
<path class="d-line d-line-violet d-dashed" d="M 120 108 L 120 138" marker-end="url(#p2c3-network-path-en-head-violet)"/>
<path class="d-line d-line-violet d-dashed" d="M 120 196 L 120 226" marker-end="url(#p2c3-network-path-en-head-violet)"/>
