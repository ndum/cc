<text class="d-sub" x="368" y="278" text-anchor="middle">only the front-end and the nodes are visible</text>
<rect class="d-shadow" x="32" y="53.5" width="176" height="56" rx="10"/>
<rect class="d-tile d-tile-violet" x="32" y="52" width="176" height="56" rx="10"/>
<g class="d-icon d-icon-violet" transform="translate(44 71) scale(0.75)"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8.5" y="8.5" width="7" height="7" rx="1"/></g>
<text class="d-title d-title-violet" x="72" y="77" text-anchor="start">VM</text>
<text class="d-sub" x="72" y="93" text-anchor="start">in cc-net, MTU 1450</text>
<rect class="d-shadow" x="32" y="141.5" width="176" height="56" rx="10"/>
