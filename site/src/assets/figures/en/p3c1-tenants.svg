<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 468" role="img" aria-labelledby="p3c1-tenants-en-title p3c1-tenants-en-desc">
<title id="p3c1-tenants-en-title">Groups, group admins and the VDC of the members</title>
<desc id="p3c1-tenants-en-desc">At the top the VDC wolkenwerk holds the four groups praxis, treuhand, velo and gemeinde, one per member. Each group has a group admin such as praxis-admin who creates the group's users. The groups may create VMs, images, templates and documents and only see their own objects. At the bottom is cluster 0 with node 1, node 2, the network cc-net and the datastores. The platform team assigns it to the VDC, so all four groups share the same nodes.</desc>
