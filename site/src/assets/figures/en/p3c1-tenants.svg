<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="p3c1-tenants-en-title p3c1-tenants-en-desc">
<title id="p3c1-tenants-en-title">Groups, group admins and the VDC of the members</title>
<desc id="p3c1-tenants-en-desc">At the top the VDC wolkenwerk holds the four groups praxis, treuhand, velo and gemeinde, one per member. Every group has a group admin such as praxis-admin who creates the users of the group. Every group may create VMs, images, templates and documents and only sees its own objects. At the bottom is cluster 0 with node 1, node 2, the network cc-net and the datastores, which the platform team assigns to the VDC.</desc>
