<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-labelledby="p3c2-quota-en-title p3c2-quota-en-desc">
<title id="p3c2-quota-en-title">Quota, reservation and use</title>
<desc id="p3c2-quota-en-desc">The group praxis has the course values and the VMs praxis-1 and praxis-2 from the template ubuntu. For CPU the quota allows 1.5. On the nodes the VMs reserve 1.0, 0.5 each. Under load they use up to 2.0, because each VM has a full virtual CPU. For memory the quota allows 2048 MB. The two VMs reserve exactly that with 1024 MB each and use at most as much, less when idle. Notice that the quota only counts what is reserved and does not limit how hard the VMs work their CPU. With 2 of 2 VMs, OpenNebula rejects a third VM.</desc>
<defs><marker id="p3c2-quota-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c2-quota-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="760" height="372" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="728" height="340" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">GROUP</text>
<text class="d-code" x="84.04400000000001" y="40" text-anchor="start">praxis</text>
<text class="d-meta" x="728" y="40" text-anchor="end">praxis-1 and praxis-2 from the template ubuntu</text>
<rect class="d-shadow" x="32" y="57.5" width="696" height="120" rx="10"/>
<rect class="d-tile" x="32" y="56" width="696" height="120" rx="10"/>
<text class="d-title" x="48" y="80" text-anchor="start">CPU</text>
<text class="d-meta" x="84.1112" y="80" text-anchor="start">in cores</text>
<path class="d-grid" d="M 152 90 L 152 152"/>
<text class="d-meta" x="152" y="166" text-anchor="middle">0</text>
<path class="d-grid" d="M 240 90 L 240 152"/>
<text class="d-meta" x="240" y="166" text-anchor="middle">0.5</text>
<path class="d-grid" d="M 328 90 L 328 152"/>
<text class="d-meta" x="328" y="166" text-anchor="middle">1</text>
<path class="d-grid" d="M 416 90 L 416 152"/>
<text class="d-meta" x="416" y="166" text-anchor="middle">1.5</text>
<path class="d-grid" d="M 504 90 L 504 152"/>
<text class="d-meta" x="504" y="166" text-anchor="middle">2</text>
<text class="d-sub" x="48" y="104" text-anchor="start">Quota</text>
<text class="d-sub" x="48" y="124" text-anchor="start">Reserved</text>
<text class="d-sub" x="48" y="144" text-anchor="start">Used</text>
<rect class="d-fill-blue" x="152" y="94" width="264" height="12" rx="3"/>
<rect class="d-fill-violet" x="152" y="114" width="86" height="12" rx="3"/>
<rect class="d-fill-violet" x="240" y="114" width="88" height="12" rx="3"/>
<rect class="d-fill-teal" x="152" y="134" width="352" height="12" rx="3"/>
<path class="d-line d-line-accent d-dashed" d="M 416 88 L 416 152"/>
<text class="d-sub" x="524" y="104" text-anchor="start">1.5</text>
<text class="d-sub" x="524" y="124" text-anchor="start">1.0 = 2 × 0.5</text>
<text class="d-sub" x="524" y="144" text-anchor="start">up to 2.0 = 2 × VCPU 1</text>
<rect class="d-shadow" x="32" y="193.5" width="696" height="120" rx="10"/>
<rect class="d-tile" x="32" y="192" width="696" height="120" rx="10"/>
<text class="d-title" x="48" y="216" text-anchor="start">Memory</text>
<text class="d-meta" x="106.5726" y="216" text-anchor="start">in MB</text>
<path class="d-grid" d="M 152 226 L 152 288"/>
<text class="d-meta" x="152" y="302" text-anchor="middle">0</text>
<path class="d-grid" d="M 240 226 L 240 288"/>
<text class="d-meta" x="240" y="302" text-anchor="middle">512</text>
<path class="d-grid" d="M 328 226 L 328 288"/>
<text class="d-meta" x="328" y="302" text-anchor="middle">1024</text>
<path class="d-grid" d="M 416 226 L 416 288"/>
<text class="d-meta" x="416" y="302" text-anchor="middle">1536</text>
<path class="d-grid" d="M 504 226 L 504 288"/>
<text class="d-meta" x="504" y="302" text-anchor="middle">2048</text>
<text class="d-sub" x="48" y="240" text-anchor="start">Quota</text>
<text class="d-sub" x="48" y="260" text-anchor="start">Reserved</text>
<text class="d-sub" x="48" y="280" text-anchor="start">Used</text>
<rect class="d-fill-blue" x="152" y="230" width="352" height="12" rx="3"/>
<rect class="d-fill-violet" x="152" y="250" width="174" height="12" rx="3"/>
<rect class="d-fill-violet" x="328" y="250" width="176" height="12" rx="3"/>
<rect class="d-fill-teal" x="152" y="270" width="352" height="12" rx="3"/>
<path class="d-line d-line-accent d-dashed" d="M 504 224 L 504 288"/>
<text class="d-sub" x="524" y="240" text-anchor="start">2048</text>
<text class="d-sub" x="524" y="260" text-anchor="start">2048 = 2 × 1024</text>
<text class="d-sub" x="524" y="280" text-anchor="start">up to 2048, less when idle</text>
<text class="d-sub" x="32" y="340" text-anchor="start">The quota only limits what is reserved. With 2 of 2 VMs, OpenNebula rejects a third VM.</text>
</svg>
