<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" role="img" aria-labelledby="p3c5-oneflow-en-title p3c5-oneflow-en-desc">
<title id="p3c5-oneflow-en-title">The OneFlow service of the fiduciary office</title>
<desc id="p3c5-oneflow-en-desc">In the target state of task A, OneFlow on the front-end at the top reads the roles and rules of your service template. Rules by schedule follow the system clock, and rules by load follow the CPU that monitoring measures for every VM. Based on these values OneFlow changes the cardinality of a role. At the bottom the service runs in the group treuhand. Some of its VMs always run, and more VMs join by load or by schedule and leave again afterwards. Next to them runs treuhand-1, another VM of the group. Notice the lines below the VMs. The role stays between min_vms and max_vms, and all VMs of the service fit into the quota of the fiduciary office together with treuhand-1.</desc>
