<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" role="img" aria-labelledby="p3c5-report-en-title p3c5-report-en-desc">
<title id="p3c5-report-en-title">The monthly showback report</title>
<desc id="p3c5-report-en-desc">In the target state of task B, your timer on the front-end at the top starts your service, a systemd unit, once a month. The service runs your script, which queries the showback of OpenNebula and stores the report of the past month as a CSV file with the month in its name. Next to it, the timer opennebula-showback.timer that OpenNebula ships calculates the showback every day. At the bottom you calculate the cost coverage from the report and the costs of a month, the showback total divided by all costs. The costs rest on your assumptions. From this you make a proposal to the board. Notice that two timers work on the showback, yours and the one of OpenNebula.</desc>
