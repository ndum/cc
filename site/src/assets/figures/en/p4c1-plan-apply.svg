<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 308" role="img" aria-labelledby="p4c1-plan-apply-en-title p4c1-plan-apply-en-desc">
<title id="p4c1-plan-apply-en-title">Plan and apply with the state</title>
<desc id="p4c1-plan-apply-en-desc">The code in Git on the left is the desired state, and OpenNebula on the right holds the actual state. tofu plan reads the code, the state in terraform.tfstate and the actual state, and only shows what would change. tofu apply reads the code, changes the VMs through the OpenNebula API and then writes the state. On the far right someone changes a VM by hand in Sunstone or with the CLI. Notice that only apply changes anything, and that the next plan catches this drift because it reads the actual state.</desc>
