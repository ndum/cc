<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 286" role="img" aria-labelledby="p4c4-app-of-apps-en-title p4c4-app-of-apps-en-desc">
<title id="p4c4-app-of-apps-en-title">App of apps in the platform repo</title>
<desc id="p4c4-app-of-apps-en-desc">The application root is applied once during the bootstrap and points to the folder apps. It holds the application webshop, which brings the folder webshop into the namespace velo, and the ApplicationSet members. The ApplicationSet generates one application for each folder under members, such as member-velo and member-gemeinde.</desc>
<defs><marker id="p4c4-app-of-apps-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-band d-band-1" x="16" y="16" width="196" height="254" rx="6"/>
<text class="d-label" x="32" y="40" text-anchor="start">BOOTSTRAP</text>
<text class="d-meta" x="196" y="40" text-anchor="end">once</text>
<rect class="d-tile" x="32" y="115" width="164" height="50" rx="4"/>
<rect class="d-bar" x="32" y="115" width="4" height="50" rx="2"/>
<text class="d-title" x="114" y="137" text-anchor="middle">root</text>
<text class="d-sub" x="114" y="154" text-anchor="middle">Application, folder apps</text>
<rect class="d-band d-band-2" x="252" y="16" width="216" height="254" rx="6"/>
<text class="d-label" x="268" y="40" text-anchor="start">FOLDER APPS</text>
<rect class="d-tile" x="268" y="60" width="184" height="50" rx="4"/>
<text class="d-title" x="360" y="82" text-anchor="middle">webshop</text>
<text class="d-sub" x="360" y="99" text-anchor="middle">Application, namespace velo</text>
<rect class="d-tile" x="268" y="170" width="184" height="50" rx="4"/>
<text class="d-title" x="360" y="192" text-anchor="middle">members</text>
<text class="d-sub" x="360" y="209" text-anchor="middle">ApplicationSet, members/*</text>
<rect class="d-band d-band-1" x="508" y="106" width="216" height="164" rx="6"/>
<text class="d-label" x="524" y="130" text-anchor="start">GENERATED</text>
<text class="d-meta" x="708" y="130" text-anchor="end">one per folder</text>
<rect class="d-tile" x="524" y="146" width="184" height="50" rx="4"/>
<text class="d-title" x="616" y="168" text-anchor="middle">member-velo</text>
<text class="d-sub" x="616" y="185" text-anchor="middle">folder members/velo</text>
<rect class="d-tile" x="524" y="206" width="184" height="50" rx="4"/>
<text class="d-title" x="616" y="228" text-anchor="middle">member-gemeinde</text>
<text class="d-sub" x="616" y="245" text-anchor="middle">folder members/gemeinde</text>
<path class="d-arrow" d="M 196 132 L 232 132 L 232 85 L 266 85" marker-end="url(#p4c4-app-of-apps-en-head)"/>
<path class="d-arrow" d="M 196 148 L 232 148 L 232 195 L 266 195" marker-end="url(#p4c4-app-of-apps-en-head)"/>
<path class="d-arrow" d="M 452 187 L 488 187 L 488 171 L 522 171" marker-end="url(#p4c4-app-of-apps-en-head)"/>
<path class="d-arrow" d="M 452 203 L 488 203 L 488 231 L 522 231" marker-end="url(#p4c4-app-of-apps-en-head)"/>
</svg>
