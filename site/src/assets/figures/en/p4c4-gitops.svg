<text class="d-label d-label-blue" x="216" y="40" text-anchor="start">FRONT-END</text>
<rect class="d-tag" x="663" y="27" width="65" height="18" rx="9"/>
<text class="d-tag-text" x="695.5" y="39.5" text-anchor="middle">port 3000</text>
<rect class="d-band d-band-3" x="200" y="206" width="544" height="114" rx="12"/>
<text class="d-label d-label-violet" x="216" y="230" text-anchor="start">K3S CLUSTER</text>
<path class="d-arrow d-arrow-accent" d="M 176 81 L 214 81" marker-end="url(#p4c4-gitops-en-head-accent)"/>
<path class="d-arrow d-arrow-accent" d="M 96 106 L 96 132 L 520 132 L 520 108" marker-end="url(#p4c4-gitops-en-head-accent)"/>
<text class="d-code" x="530" y="124" text-anchor="start">git push</text>
<path class="d-arrow d-arrow-accent" d="M 404 81 L 474 81" marker-end="url(#p4c4-gitops-en-head-accent)"/>
<text class="d-sub" x="440" y="74" text-anchor="middle">merge</text>
<path class="d-arrow d-arrow-accent" d="M 602 246 L 602 108" marker-end="url(#p4c4-gitops-en-head-accent)"/>
<text class="d-sub" x="592" y="174" text-anchor="end">polls every minute</text>
<text class="d-sub" x="592" y="190" text-anchor="end">read only</text>
<path class="d-arrow d-arrow-accent" d="M 476 261 L 406 261" marker-end="url(#p4c4-gitops-en-head-accent)"/>
<path class="d-arrow" d="M 404 281 L 474 281" marker-end="url(#p4c4-gitops-en-head)"/>
<text class="d-sub" x="440" y="254" text-anchor="middle">applies</text>
<text class="d-sub" x="440" y="298" text-anchor="middle">live state</text>
