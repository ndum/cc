<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 266" role="img" aria-labelledby="p4c4-gitops-en-title p4c4-gitops-en-desc">
<title id="p4c4-gitops-en-title">The GitOps loop</title>
<desc id="p4c4-gitops-en-desc">The platform team sends changes with git push to Gitea on the front-end or opens a pull request that someone reviews and merges. Argo CD in the cluster polls the repo wolkenwerk/platform every minute with read-only access, compares the desired state from Git with the live state in the cluster and applies the differences, for example to the web shop in the namespace velo. If someone changes the cluster by hand with kubectl, self-heal reverts the change.</desc>
<defs><marker id="p4c4-gitops-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p4c4-gitops-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="812" height="266" rx="14"/>
<rect class="d-shadow" x="16" y="61.5" width="150" height="50" rx="10"/>
<rect class="d-tile" x="16" y="60" width="150" height="50" rx="10"/>
<text class="d-title" x="91" y="82" text-anchor="middle">Platform team</text>
<text class="d-sub" x="91" y="98" text-anchor="middle">push or pull request</text>
<rect class="d-band d-band-2" x="180" y="16" width="184" height="234" rx="12"/>
<text class="d-label" x="196" y="40" text-anchor="start">FRONT-END</text>
<text class="d-meta" x="348" y="40" text-anchor="end">port 3000</text>
<rect class="d-shadow" x="196" y="61.5" width="152" height="50" rx="10"/>
<rect class="d-tile" x="196" y="60" width="152" height="50" rx="10"/>
<text class="d-title" x="272" y="82" text-anchor="middle">Pull request</text>
<text class="d-sub" x="272" y="98" text-anchor="middle">review, merge</text>
<rect class="d-shadow" x="196" y="181.5" width="152" height="50" rx="10"/>
<rect class="d-tile" x="196" y="180" width="152" height="50" rx="10"/>
<text class="d-title" x="272" y="202" text-anchor="middle">Gitea</text>
<text class="d-code" x="272" y="218" text-anchor="middle">wolkenwerk/platform</text>
<rect class="d-band d-band-1" x="464" y="16" width="332" height="234" rx="12"/>
<text class="d-label" x="480" y="40" text-anchor="start">K3S CLUSTER</text>
<rect class="d-shadow" x="480" y="61.5" width="160" height="50" rx="10"/>
<rect class="d-tile" x="480" y="60" width="160" height="50" rx="10"/>
<text class="d-title" x="560" y="82" text-anchor="middle">Web shop</text>
<text class="d-sub" x="560" y="98" text-anchor="middle">namespace velo</text>
<rect class="d-shadow" x="480" y="181.5" width="160" height="50" rx="10"/>
<rect class="d-tile d-tile-accent" x="480" y="180" width="160" height="50" rx="10"/>
<text class="d-title" x="560" y="202" text-anchor="middle">Argo CD</text>
<text class="d-sub" x="560" y="218" text-anchor="middle">compares desired and live</text>
<rect class="d-shadow" x="668" y="61.5" width="112" height="50" rx="10"/>
<rect class="d-tile" x="668" y="60" width="112" height="50" rx="10"/>
<text class="d-title" x="724" y="82" text-anchor="middle">By hand</text>
<text class="d-code" x="724" y="98" text-anchor="middle">kubectl scale</text>
<path class="d-arrow" d="M 166 85 L 194 85" marker-end="url(#p4c4-gitops-en-head)"/>
<path class="d-arrow" d="M 86 110 L 86 205 L 194 205" marker-end="url(#p4c4-gitops-en-head)"/>
<text class="d-code" x="94" y="150" text-anchor="start">git push</text>
<path class="d-arrow" d="M 272 110 L 272 178" marker-end="url(#p4c4-gitops-en-head)"/>
<text class="d-sub" x="280" y="150" text-anchor="start">merge</text>
<path class="d-arrow" d="M 348 205 L 478 205" marker-end="url(#p4c4-gitops-en-head)"/>
<text class="d-sub" x="414" y="198" text-anchor="middle">polls each minute</text>
<text class="d-sub" x="414" y="220" text-anchor="middle">read only</text>
<path class="d-arrow" d="M 532 180 L 532 112" marker-end="url(#p4c4-gitops-en-head)"/>
<text class="d-sub" x="524" y="150" text-anchor="end">applies</text>
