<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" role="img" aria-labelledby="p4c6-branch-en-title p4c6-branch-en-desc">
<title id="p4c6-branch-en-title">The protected branch main</title>
<desc id="p4c6-branch-en-desc">The target state of task C. On the left is the platform team with two accounts, your account platform, which is also the Gitea administrator, and a second account with write access. In the middle, Gitea holds the repo wolkenwerk/platform with the protected branch main. Gitea rejects a direct push from platform to main. A pull request from platform needs an approval. The second account approves it, and only then does Gitea merge it into main. On the right, Argo CD in the k3s cluster pulls main with read access only and applies the change as before. Notice that you decide yourself who may bypass the rule.</desc>
