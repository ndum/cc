<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" role="img" aria-labelledby="p5c3-budget-en-title p5c3-budget-en-desc">
<title id="p5c3-budget-en-title">Error budget and burn rate of the web shop</title>
<desc id="p5c3-budget-en-desc">At the top the numbers of the web shop. The SLO asks for 99.5% of the requests without a server error over 7 days, so the error budget is 0.5% of the requests. At a burn rate of 1 the budget lasts exactly 7 days, at 14.4 it is gone after 12 hours. Below, a schematic course with steady traffic. Once the errors start, the burn rate in the five-minute window quickly rises above the threshold of 14.4, which is 7.2% errors. In the one-hour window it rises slowly. The alert only fires when both windows have been above the threshold for two minutes. As soon as the fix takes effect, the short window drops and the alert ends, although the long window is still high.</desc>
<defs><marker id="p5c3-budget-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p5c3-budget-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="760" height="368" rx="14"/>
<rect class="d-shadow" x="16" y="17.5" width="226" height="56" rx="10"/>
<rect class="d-tile" x="16" y="16" width="226" height="56" rx="10"/>
<g class="d-icon" transform="translate(28 35) scale(0.75)"><path d="M4 20h16"/><path d="M7 16v-4M12 16V8M17 16v-7"/></g>
<text class="d-title" x="56" y="41" text-anchor="start">SLO 99.5%</text>
<text class="d-sub" x="56" y="57" text-anchor="start">no server errors, 7 days</text>
<rect class="d-shadow" x="267" y="17.5" width="226" height="56" rx="10"/>
<rect class="d-tile" x="267" y="16" width="226" height="56" rx="10"/>
<g class="d-icon" transform="translate(279 35) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M14.5 9c-.5-1-1.5-1.5-2.5-1.5-1.7 0-2.8 1-2.8 2.2 0 2.9 5.6 1.6 5.6 4.5 0 1.2-1.2 2.3-2.8 2.3-1.1 0-2.2-.6-2.7-1.6M12 6v1.5M12 16.5V18"/></g>
<text class="d-title" x="307" y="41" text-anchor="start">Error budget 0.5%</text>
<text class="d-sub" x="307" y="57" text-anchor="start">of the requests may fail</text>
<rect class="d-shadow" x="518" y="17.5" width="226" height="56" rx="10"/>
<rect class="d-tile" x="518" y="16" width="226" height="56" rx="10"/>
<g class="d-icon" transform="translate(530 35) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
<text class="d-title" x="558" y="41" text-anchor="start">Burn rate 14.4</text>
<text class="d-sub" x="558" y="57" text-anchor="start">budget gone after 12 hours</text>
<rect class="d-band d-band-1" x="16" y="96" width="728" height="256" rx="12"/>
<text class="d-label" x="32" y="120" text-anchor="start">BURN RATE IN THE SHORT AND THE LONG WINDOW</text>
<text class="d-meta" x="728" y="120" text-anchor="end">schematic, with steady traffic</text>
<path class="d-grid" d="M 96 262.6666666666667 H 728"/>
<path class="d-grid" d="M 96 209.33333333333331 H 728"/>
<path class="d-grid" d="M 96 156 H 728"/>
<text class="d-sub" x="88" y="320" text-anchor="end">0</text>
