<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-labelledby="p5c5-model-en-title p5c5-model-en-desc">
<title id="p5c5-model-en-title">A language model in the cluster</title>
<desc id="p5c5-model-en-desc">The target state of task A. At the top left, the platform repo wolkenwerk/platform sits in Gitea on the front-end. Argo CD in the k3s cluster pulls the language model with its requests and limits and the access rule from it. The model runs on a cluster VM with 6 GB and four cores. A NetworkPolicy stands in front of the model. It only lets in questions from the namespace of a member with the label and refuses the question of another member. The model's answer reports tokens and durations, and at the top right you measure the tokens per second for reading and for writing from them. Notice that the NetworkPolicy sits next to the model and selects namespaces by their label.</desc>
