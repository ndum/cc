<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="p5c5-prompts-en-title p5c5-prompts-en-desc">
<title id="p5c5-prompts-en-title">Two versions of the prompt compared</title>
<desc id="p5c5-prompts-en-desc">The target state of task C. At the top left, the platform repo holds two versions of the prompt, and a commit leads from the current one to the improved one. At the top right you fire the real fault through Git and keep the alert with its context. In the k3s cluster, the triage service from task B sends the same alert with one of the two versions to the language model from task A in every run, several times for each version. For every answer you note the duration and whether cause and action fit the real fault. The evaluation shows what the new version improved, what it did not and which limit remains. Notice that only the version of the prompt changes between the runs.</desc>
