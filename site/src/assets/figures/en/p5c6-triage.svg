<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 778 344" role="img" aria-labelledby="p5c6-triage-en-title p5c6-triage-en-desc">
<title id="p5c6-triage-en-title">The flow of a triage</title>
<desc id="p5c6-triage-en-desc">Prometheus evaluates a rule and sends the alert to Alertmanager. A receiver of your own forwards it as a webhook to your triage service. The service fetches log lines from Loki and the state of the affected deployment from the Kubernetes API and asks a local language model with this context. It shows the proposal with cause and action to a person, who approves it with their name or rejects it. Only an approved action from a fixed list runs, with only the rights it needs. Every alert, proposal and decision lands in the audit log.</desc>
