<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 388" role="img" aria-labelledby="p6c1-security-en-title p6c1-security-en-desc">
<title id="p6c1-security-en-title">The protection layers of front-end and cluster</title>
<desc id="p6c1-security-en-desc">In the middle the front-end. Its firewall, the nftables table cc_firewall, drops everything it does not explicitly allow. The client and other hosts reach only SSH on port 22 and the web interface on port 2616, and SSH accepts only keys and does not let root log in directly. The nodes and cc-net reach everything, including Gitea on port 3000, the API on port 2633 and the exporters on ports 9100 and 9925. Every day, unattended-upgrades installs security updates. On the right the cluster. Pod Security Admission enforces the profile restricted in the member namespaces, NetworkPolicies separate the members, and Prometheus may only read, in all namespaces. A SealedSecret comes encrypted from Gitea, and only the Sealed Secrets controller in kube-system can decrypt it with its key.</desc>
