<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 492" role="img" aria-labelledby="p6c5-postmortem-en-title p6c5-postmortem-en-desc">
<title id="p6c5-postmortem-en-title">Postmortem and cost model of a member</title>
<desc id="p6c5-postmortem-en-desc">At the top the postmortem. Three sources, the series ALERTS, the audit log of the triage service and the history of the platform repo, are ordered by time into a timeline without the model. With your question and the timeline, the local model from milestone 3 writes the draft postmortem-entwurf.md. You check it against the facts of the timeline and record your correction in postmortem.md. At the bottom the cost model. From the member's resources, its quota and its VM, you derive a monthly price through its share of the full cost, with a split of your choice. You compare the price with the showback from OpenNebula. Measured requests and measured use lead to your right-sizing proposal.</desc>
