<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 428" role="img" aria-labelledby="p6c5-restore-en-title p6c5-restore-en-desc">
<title id="p6c5-restore-en-title">Restore from a snapshot and SLA</title>
<desc id="p6c5-restore-en-desc">At the top the front-end with the copy of the snapshots and the token in ~/backup/k3s, and Gitea. Below it the k3s cluster. From the copy you restore k3s-server, depending on the failure case the existing server or a new one. Argo CD then pulls commits from Gitea again and rolls out your member's application. At the bottom left your measurement for the failure case you chose, on a timeline. You set the start and the end yourself and record intermediate times in between. The measured time goes into the SLA for your member. In it, the availability follows from the architecture, the RPO from the backups and the RTO from your measurement and the support hours.</desc>
